name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The release binaries embed the web UI (`ty serve` hosts it at /), so
      # build the frontend and stage it where the `ui` build tag embeds it.
      # Without this step the `-tags ui` build fails rather than shipping a
      # binary that serves the "doesn't include the web UI" placeholder.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Build web UI
        run: |
          cd desktop
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          rm -rf internal/web/ui/dist
          cp -R desktop/dist internal/web/ui/dist

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
