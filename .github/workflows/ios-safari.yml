name: iPhone Safari QA

on:
  workflow_dispatch:
  # Explicit opt-in before workflow_dispatch is available on the default branch.
  push:
    branches: [codex/ios-safari-qa]

permissions:
  contents: read

concurrency:
  group: iphone-safari-qa
  cancel-in-progress: true

jobs:
  safari:
    # Standard runners are free ONLY for public repositories. Fail closed if
    # visibility changes. No PR/schedule triggers, matrices, or automatic retries.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[ios-qa]'))
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set isolated paths
        run: |
          echo "APPIUM_HOME=$RUNNER_TEMP/appium-home" >> "$GITHUB_ENV"
          echo "QA_ARTIFACTS=$RUNNER_TEMP/ios-evidence" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build isolated test application
        timeout-minutes: 10
        run: |
          mkdir -p "$QA_ARTIFACTS"
          npm ci --prefix desktop --no-audit --no-fund
          npm run build --prefix desktop
          cp -R desktop/dist internal/web/ui/dist
          go build -tags ui -o "$RUNNER_TEMP/ty-ios-qa" ./cmd/task
      - name: Install pinned automation tools on runner only
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/ios-tools" --no-audit --no-fund appium@3.7.0
          echo "$RUNNER_TEMP/ios-tools/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ios-tools/node_modules/.bin/appium" driver install xcuitest@12.12.4
      - name: Exercise Safari with the software keyboard
        timeout-minutes: 9
        run: python3 scripts/qa/ios/check-safari.py "$RUNNER_TEMP/ty-ios-qa"
      - name: Bound evidence storage
        if: always()
        run: |
          python3 scripts/qa/ios/bound-evidence.py "$QA_ARTIFACTS"
      - name: Save screenshots and diagnostics for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-safari-${{ github.run_id }}
          path: ${{ env.QA_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
