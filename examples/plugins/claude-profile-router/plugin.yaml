# Route each task to whichever Claude account has the most rate-limit headroom.
#
# Copy this directory to ~/.config/task/plugins/claude-profile-router/, copy
# config.example.env to config.env, list your profiles in it, and every task ty
# spawns picks its account automatically. See README.md.
name: claude-profile-router
version: 0.1.0
description: Send each task to the Claude profile with the most usage headroom.

hooks:
  # task.route is the one hook ty waits on: it fires just before a task spawns
  # and reads the script's stdout back as a decision. See docs/plugins.md.
  task.route: route.sh

actions:
  - id: status
    label: Show usage for each Claude profile
    command: status.sh
